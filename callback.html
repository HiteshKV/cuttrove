<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>cuttrove · connected</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 64px auto; padding: 0 16px; color: #1b1b1b; background: #faf8f4; }
  code { display: block; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; word-break: break-all; }
  button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: #1b1b1b; color: #fff; cursor: pointer; }
  .err { color: #a3261b; }
</style>
</head>
<body>
<h1>cuttrove</h1>
<div id="out">Reading response…</div>
<script>
  var p = new URLSearchParams(location.search), out = document.getElementById('out');
  if (p.get('code')) {
    out.innerHTML = '<p>Account authorised. Copy this one-time code back into cuttrove — it expires in a few minutes and is useless without the app secret.</p><code id="c"></code><button id="b">Copy code</button>';
    document.getElementById('c').textContent = p.get('code');
    document.getElementById('b').onclick = function () { navigator.clipboard.writeText(p.get('code')); this.textContent = 'Copied'; };
  } else if (p.get('error')) {
    out.innerHTML = '<p class="err">Authorisation failed: <span id="e"></span></p>';
    document.getElementById('e').textContent = p.get('error_description') || p.get('error');
  } else {
    out.textContent = 'Nothing to show. This page receives the response after you connect an account to cuttrove.';
  }
</script>
</body>
</html>
